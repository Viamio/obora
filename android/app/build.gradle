plugins {
    id 'com.android.application'
}
def buildNo = (project.findProperty('buildNumber') ?: '1').toString().toInteger()
android {
    namespace 'pl.gpspole'
    compileSdk 34
    defaultConfig {
        applicationId 'pl.gpspole'
        minSdk 24
        targetSdk 34
        versionCode buildNo
        versionName "1.${buildNo}"
    }
    signingConfigs {
        fixed {
            storeFile file('gpspole.jks')
            storePassword '561d59d2a81aa11c1e4707d91a1da308'
            keyAlias 'gpspole'
            keyPassword '561d59d2a81aa11c1e4707d91a1da308'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
